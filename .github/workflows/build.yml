# Paper Pilot bouwen en testen op Windows.
# De repository is openbaar: de gewone bouwcomputers van GitHub kosten dan geen bouwminuten.
# Het installatieprogramma en de schermafbeeldingen komen op de tak exe-builds.
name: Bouwen

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "teksten/**"
      - "res/**"
      - "installer/**"
      - "tools/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "versie.txt"
      - ".cargo/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      groot_model:
        description: "Ook het echte taalmodel (Qwen3-VL 4B, ongeveer 3,5 GB) testen"
        type: boolean
        default: false

concurrency:
  group: bouwen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versie lezen
        shell: pwsh
        run: |
          $v = (Get-Content versie.txt -Raw).Trim()
          "VERSIE=$v" | Out-File -Append $env:GITHUB_ENV
          "Versie $v"

      - name: Rust klaarzetten
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Bouwen
        run: cargo build --release --locked

      - name: PDFium klaarzetten
        shell: pwsh
        run: |
          python -m pip download -q --no-deps --only-binary=:all: --platform win_amd64 pypdfium2==5.15.0 -d pdfium-whl
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('pdfium-whl/*.whl')[0]); open('pdfium.dll','wb').write(z.read('pypdfium2_raw/pdfium.dll'))"
          New-Item -ItemType Directory -Force target\release\onderdelen | Out-Null
          Copy-Item pdfium.dll target\release\onderdelen\
          Get-Item target\release\onderdelen\pdfium.dll

      - name: Proefstart
        shell: pwsh
        run: |
          $p = Start-Process target\release\PaperPilot.exe -ArgumentList "--proefstart", "proef.txt" -Wait -PassThru
          Get-Content proef.txt
          if ($p.ExitCode -ne 0) { throw "De proefstart is mislukt." }

      # Windows PowerShell 5.1 (.NET Framework): die heeft de UIA-proxy's voor gewone Windows-onderdelen,
      # net als schermlezers. PowerShell 7 ziet knoppen en menu's alleen als "Pane".
      - name: Documenten lezen
        shell: pwsh
        run: |
          $fouten = 0
          $verwacht = @{
            "voorbeeld-brief.pdf" = @("Pagina's: 2", "Kop: Uw budget voor 2027", "Kop: Vragen?", "gegevens controleren en");
            "voorbeeld-formulier.pdf" = @("Invulvelden: 7", "Kop: Wijzigingsformulier pgb", "Telefoonnummer:");
            "voorbeeld-brief.docx" = @("Kop: Brief van de gemeente", "Kop: Afspraken", "Datum | 12 november 2026");
            "scan-recht.png" = @("persoonsgebonden budget", "Kop: Zorgkantoor Voorbeeld", "Afbeelding opgeslagen", ", 0 pagina's zonder tekst", "PDF-tekst: ");
            "scan-kop.jpg" = @("op zijn kop", "persoonsgebonden budget");
            "scan-kant.png" = @("op zijn kant", "persoonsgebonden budget");
            "scan-scheef.png" = @("graden scheef", "persoonsgebonden budget");
            "scan.pdf" = @("op zijn kop", "persoonsgebonden budget");
            "twee-paginas.tif" = @("Pagina's: 2", "Pagina 2 van 2", "op zijn kop");
            "envelop.jpg" = @("envelop van Belastingdienst", "1234 AB Zeist", "Kop: Envelop");
            "theezakje.png" = @("bergamot", "minuten");
            "bijsluiter.png" = @("Paracetamol", "hooguit 6 tabletten", "bijwerkingen");
            "voorbeeld-brief.rtf" = @("Kop: Brief van de gemeente", "Kop: Afspraken", "Datum | 12 november 2026");
            "voorbeeld-brief.doc" = @("Brief van de gemeente", "Datum | 12 november 2026", "Tijd | 10.30 uur");
            "voorbeeld-brief.odt" = @("Kop: Brief van de gemeente", "Kop: Afspraken", "Datum | 12 november 2026");
            "voorbeeld-brief.html" = @("Kop: Brief van de gemeente", "Kop: Afspraken", "Datum | 12 november 2026");
            "voorbeeld-tabel.xlsx" = @("Kop: Kosten", "Kop: Tweede", "Huur | 750");
            "voorbeeld-tabel.ods" = @("Kop: Kosten", "Huur | 750");
            "voorbeeld-dia.pptx" = @("Kop: Dia 2", "Formulieren invullen");
            "voorbeeld-dia.odp" = @("Kop: Dia 2", "Formulieren invullen");
            "qr-factuur.pdf" = @("betaal-QR-code: 12,50 euro aan Gemeente Voorbeeld", "NL91ABNA0417164300", "Kop: Factuur");
            "qr-factuur.png" = @("NL91ABNA0417164300", "https://www.rijksoverheid.nl");
            "qr-foto.jpg" = @("NL91ABNA0417164300", "https://www.rijksoverheid.nl");
            "streepjescode.png" = @("Nummer: 8712345678906");
            "voorbeeld-boek.epub" = @("Kop: Het voorbeeldboek", "Kop: Hoofdstuk 2: Het einde", "voor & iedereen");
            "voorbeeld-aanslag.txt" = @("Gegevens: Bedrag: 245,80 euro", "NL91 ABNA 0417 1643 00", "5000 1234 5678 9012", "Datum: 1 december 2026", "030 - 286 00 00")
          }
          foreach ($f in $verwacht.Keys) {
            $p = Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-lezen", "tests\$f", "lezen-$f.txt" -Wait -PassThru
            $t = Get-Content "lezen-$f.txt" -Raw -Encoding utf8
            "==== $f"; $t.Substring(0, [Math]::Min(1500, $t.Length))
            if ($p.ExitCode -ne 0) { "FOUT: $f gaf foutcode $($p.ExitCode)"; $fouten++ }
            if ($f -eq "scan-recht.png" -and $t.Contains("Melding:")) { "FOUT: de rechte scan kreeg toch een melding"; $fouten++ }
            foreach ($v in $verwacht[$f]) { if (-not $t.Contains($v)) { "FOUT: '$v' ontbreekt in $f"; $fouten++ } }
          }
          if ($fouten -gt 0) { throw "$fouten fout(en) bij het lezen." }

      - name: Formulier invullen
        shell: pwsh
        run: |
          $p = Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-invullen", "tests\voorbeeld-formulier.pdf", "ingevuld.pdf", "invullen.txt" -Wait -PassThru
          Get-Content invullen.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Formulier invullen werkt niet." }
          $t = Get-Content invullen.txt -Raw -Encoding utf8
          foreach ($v in "Velden: 7", "Vraag 1: Naam", "Mijn gegevens: bsn", "Goed Naam") { if (-not $t.Contains($v)) { throw "'$v' ontbreekt." } }

      - name: Formulieren zonder invulvelden
        shell: pwsh
        run: |
          $fouten = 0
          $verwacht = @{
            "plat-formulier.pdf" = @("'Voorletters'", "'Geslacht: Man'", "'Een voorleesapparaat'", "'Plaats'", "'Datum'", "'Handtekening'", "antwoorden staan op de pagina");
            "plat-scan.png" = @("'Voorletters'", "'Een voorleesapparaat'", "'Handtekening'", "Ingevuld opgeslagen")
          }
          foreach ($f in $verwacht.Keys) {
            $p = Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-plat", "tests\$f", "plat-$f.txt" -Wait -PassThru
            $t = Get-Content "plat-$f.txt" -Raw -Encoding utf8
            "==== $f"; $t
            if ($t.Contains("E-mail")) { "FOUT: de regel met het e-mailadres werd een invulplek"; $fouten++ }
            foreach ($v in $verwacht[$f]) { if (-not $t.Contains($v)) { "FOUT: $v ontbreekt bij $f"; $fouten++ } }
          }
          if ($fouten -gt 0) { throw "$fouten fout(en) bij formulieren zonder invulvelden." }

      - name: Echte formulieren van een zorgkantoor lezen (ter informatie)
        continue-on-error: true
        shell: pwsh
        run: |
          $adressen = @(
            "https://www.cz.nl/-/media/files/zorgkantoor/formulieren/omzetten-zorg.pdf",
            "https://www.cz.nl/-/media/files/zorgkantoor/formulieren/wijzigingen-doorgeven-zorg-in-natura.pdf",
            "https://www.cz.nl/-/media/files/zorgkantoor/actueel/klant/budgetplan-pgb-wlz.pdf"
          )
          foreach ($a in $adressen) {
            $naam = Split-Path $a -Leaf
            try { Invoke-WebRequest $a -OutFile $naam -TimeoutSec 60 } catch { "Kon $naam niet ophalen: $_"; continue }
            Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-lezen", $naam, "lezen-$naam.txt" -Wait
            "==== $naam"
            Get-Content "lezen-$naam.txt" -Encoding utf8 | Select-Object -First 60
            Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-plat", $naam, "plat-$naam.txt" -Wait
            "---- invulplekken in $naam"
            Get-Content "plat-$naam.txt" -Encoding utf8
          }

      - name: Taalmodel voor beelden (klein model)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PAPERPILOT_TAALMODEL = "$env:RUNNER_TEMP\pp-klein"
          $p = Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-beeldmodel", "ggml-org/SmolVLM-256M-Instruct-GGUF", "tests\boodschappen.png", "beeldmodel-klein.txt" -Wait -PassThru
          Get-Content beeldmodel-klein.txt -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Het kleine taalmodel werkt niet." }

      - name: Taalmodel voor beelden (het echte model)
        if: github.event.inputs.groot_model == 'true'
        shell: pwsh
        run: |
          $env:PAPERPILOT_TAALMODEL = "$env:RUNNER_TEMP\pp-groot"
          foreach ($f in "boodschappen.png", "scan-kop.jpg") {
            $p = Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-beeldmodel", "Qwen/Qwen3-VL-4B-Instruct-GGUF", "tests\$f", "beeldmodel-groot-$f.txt" -Wait -PassThru
            Get-Content "beeldmodel-groot-$f.txt" -Encoding utf8
            if ($p.ExitCode -ne 0) { throw "Het taalmodel werkt niet ($f)." }
          }

      - name: Toegankelijkheid (UI Automation)
        shell: powershell
        run: tools\toegankelijkheid.ps1 | Tee-Object -FilePath toegankelijkheid.txt

      - name: Schermafbeeldingen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($x in @(@("nl", "licht"), @("nl", "donker"), @("en", "licht"))) {
            $naam = "scherm-$($x[0])-$($x[1])"
            Start-Process target\release\PaperPilot.exe -ArgumentList "--schermafbeelding", "$naam.bmp", "--taal", $x[0], "--thema", $x[1] -Wait
            $img = [System.Drawing.Image]::FromFile((Resolve-Path "$naam.bmp"))
            $img.Save("$PWD\$naam.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
            "$naam.png gemaakt"
          }

      - name: Scanners zoeken (ter informatie)
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-scanners", "scanners.txt" -Wait
          Get-Content scanners.txt

      - name: Updates zoeken in de Dropbox-map
        shell: pwsh
        run: |
          Start-Process target\release\PaperPilot.exe -ArgumentList "--proef-updates", "updates.txt" -Wait
          Get-Content updates.txt
          if ((Get-Content updates.txt -Raw) -match "^Fout") { throw "Zoeken naar updates werkt niet." }

      - name: Installatieprogramma maken
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersie=$env:VERSIE" installer\PaperPilot.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup is mislukt." }
          Get-ChildItem uitvoer

      - name: Proef installeren, bijwerken en verwijderen
        shell: pwsh
        run: |
          $setup = (Get-Item "uitvoer\Paper Pilot $env:VERSIE installatie.exe").FullName
          $exe = "$env:ProgramFiles\Paper Pilot\PaperPilot.exe"
          foreach ($ronde in 1, 2) {
            # Niet -Wait: dat wacht ook op Paper Pilot, dat na het installeren vanzelf start.
            $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=dutch" -PassThru
            if (-not $p.WaitForExit(300000)) { throw "Installeren (ronde $ronde) duurt te lang." }
            if ($p.ExitCode -ne 0) { throw "Installeren (ronde $ronde) is mislukt: $($p.ExitCode)" }
            Start-Sleep 3
            Stop-Process -Name PaperPilot -Force -ErrorAction SilentlyContinue
            if (-not (Test-Path $exe)) { throw "PaperPilot.exe staat niet in Program Files." }
            if (-not (Test-Path "$env:ProgramFiles\Paper Pilot\onderdelen\pdfium.dll")) { throw "pdfium.dll ontbreekt na het installeren." }
            "Ronde ${ronde}: geinstalleerd, versie $((Get-Item $exe).VersionInfo.FileVersion)"
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Paper Pilot.lnk")) { throw "Geen snelkoppeling in het Startmenu." }
          $p = Start-Process "$env:ProgramFiles\Paper Pilot\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "Verwijderen is niet gelukt." }
          "Verwijderd: GESLAAGD"

      - name: Naar de tak exe-builds
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory uit | Out-Null
          Copy-Item "uitvoer\*.exe", "scherm-*.png", "proef.txt", "toegankelijkheid.txt" uit\
          Copy-Item "lezen-*.txt", "beeldmodel*.txt", "invullen.txt", "ingevuld.pdf", "plat-*.txt", "plat-*.pdf" uit\ -ErrorAction SilentlyContinue
          @"
          # Paper Pilot $env:VERSIE

          Gebouwd uit commit $env:GITHUB_SHA.

          - Installatieprogramma: Paper Pilot $env:VERSIE installatie.exe
          - Schermafbeeldingen: scherm-nl-licht.png, scherm-nl-donker.png, scherm-en-licht.png
          - Proeven: proef.txt en toegankelijkheid.txt
          "@ | Set-Content uit\README.md -Encoding utf8
          cd uit
          git init -q
          git checkout -q -b exe-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Paper Pilot $env:VERSIE ($env:GITHUB_SHA)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" exe-builds
