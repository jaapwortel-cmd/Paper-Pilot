[package]
name = "paper-pilot"
version = "0.0.1"
edition = "2021"
description = "Paper Pilot: brieven lezen en formulieren invullen, helemaal zelf."
license = "GPL-3.0-or-later"
authors = ["Jaap Wortel"]
build = "build.rs"

[[bin]]
name = "PaperPilot"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_Urlmon",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_Storage_Xps",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
