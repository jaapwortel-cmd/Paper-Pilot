[package]
name = "paper-pilot"
version = "0.0.1"
edition = "2021"
description = "Paper Pilot: brieven lezen en formulieren invullen, helemaal zelf."
license = "GPL-3.0-or-later"
authors = ["Jaap Wortel"]
build = "build.rs"

[[bin]]
name = "PaperPilot"
path = "src/main.rs"

[dependencies]
cfb = "0.10"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
quick-xml = "0.37"
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "full_barcode_format_support", "encoding_rs"] }
serde_json = "1"
windows-collections = "0.3"
windows = { version = "0.62", features = ["Devices_Enumeration", "Devices_Scanners", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Capture", "Media_MediaProperties", "Media_Ocr", "Storage", "Storage_FileProperties", "Storage_Search", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Printing",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Mapi",
  "Win32_System_Ole",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_Storage_Xps",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
